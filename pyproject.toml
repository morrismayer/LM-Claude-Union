[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lm-claude-union"
version = "0.1.0"
description = "Direct connection between Jupyter notebooks and Claude — query one or many notebooks at once"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40.0",
    "nbformat>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lm_claude_union"]
